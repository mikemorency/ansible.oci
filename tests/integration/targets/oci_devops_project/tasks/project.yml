---
- name: Check project creation
  ansible.oci.oci_devops_project: &project_create
    compartment_id: "{{ oci_integration_compartment_id }}"
    name: "{{ oci_devops_project_name }}"
    description: "{{ oci_devops_project_integration_description }}"
    notification_config:
      topic_id: "{{ devops_topic.resource.topic_id }}"
    freeform_tags: "{{ oci_devops_project_integration_create_tags }}"
  check_mode: true
  register: project_create_check

- name: Verify creation check left the project absent
  ansible.oci.oci_devops_project_info:
    compartment_id: "{{ oci_integration_compartment_id }}"
    name: "{{ oci_devops_project_name }}"
  register: project_create_check_info
  failed_when: >-
    not project_create_check.changed or
    project_create_check_info.projects | length != 0

- name: Create project
  ansible.oci.oci_devops_project:
    <<: *project_create
  register: project_create

- name: Capture project id for cleanup
  ansible.builtin.set_fact:
    oci_devops_project_cleanup_id: "{{ project_create.resource.id }}"

- name: Verify created project values
  ansible.builtin.assert:
    that:
      - project_create.changed
      - project_create.resource.id | length > 0
      - project_create.resource.name == oci_devops_project_name
      - project_create.resource.compartment_id == oci_integration_compartment_id
      - project_create.resource.description == oci_devops_project_integration_description
      - project_create.resource.notification_config.topic_id == devops_topic.resource.topic_id
      - project_create.resource.lifecycle_state == 'ACTIVE'
      - project_create.resource.freeform_tags.phase == 'create'

- name: Wait for project visibility by exact name
  ansible.oci.oci_devops_project_info:
    compartment_id: "{{ oci_integration_compartment_id }}"
    name: "{{ oci_devops_project_name }}"
    lifecycle_state: active
  register: project_by_name
  until: project_by_name.projects | length == 1
  retries: 12
  delay: 5

- name: Verify project creation is idempotent without project_id
  ansible.oci.oci_devops_project:
    <<: *project_create
  register: project_create_rerun
  failed_when: >-
    project_create_rerun.changed or
    project_create_rerun.resource.id != project_create.resource.id

- name: Verify project creation is idempotent in check mode
  ansible.oci.oci_devops_project:
    <<: *project_create
  check_mode: true
  register: project_create_check_rerun
  failed_when: >-
    project_create_check_rerun.changed or
    project_create_check_rerun.resource.id != project_create.resource.id

- name: Retrieve project by id
  ansible.oci.oci_devops_project_info:
    project_id: "{{ project_create.resource.id }}"
  register: project_by_id

- name: Retrieve projects by compartment and lifecycle state
  ansible.oci.oci_devops_project_info:
    compartment_id: "{{ oci_integration_compartment_id }}"
    lifecycle_state: active
  register: projects_active

- name: Verify info queries return the project
  ansible.builtin.assert:
    that:
      - project_by_id.projects | length == 1
      - project_by_id.projects[0].id == project_create.resource.id
      - project_by_id.projects[0].name == oci_devops_project_name
      - project_by_id.projects[0].compartment_id == oci_integration_compartment_id
      - project_by_id.projects[0].notification_config.topic_id == devops_topic.resource.topic_id
      - projects_active.projects | selectattr('id', 'equalto', project_create.resource.id) | list | length == 1

- name: Check project update
  ansible.oci.oci_devops_project: &project_update
    project_id: "{{ project_create.resource.id }}"
    description: "{{ oci_devops_project_integration_description }} updated"
    notification_config:
      topic_id: "{{ devops_alt_topic.resource.topic_id }}"
    freeform_tags: "{{ oci_devops_project_integration_update_tags }}"
  check_mode: true
  register: project_update_check
  failed_when: not project_update_check.changed

- name: Verify update check left the project unchanged
  ansible.oci.oci_devops_project_info:
    project_id: "{{ project_create.resource.id }}"
  register: project_update_check_info
  failed_when: >-
    project_update_check_info.projects | length != 1 or
    project_update_check_info.projects[0].description !=
      oci_devops_project_integration_description or
    project_update_check_info.projects[0].notification_config.topic_id !=
      devops_topic.resource.topic_id or
    project_update_check_info.projects[0].freeform_tags.phase != 'create'

- name: Update project
  ansible.oci.oci_devops_project:
    <<: *project_update
  register: project_update

- name: Verify updated project values
  ansible.builtin.assert:
    that:
      - project_update.changed
      - project_update.resource.id == project_create.resource.id
      - project_update.resource.name == oci_devops_project_name
      - project_update.resource.description == oci_devops_project_integration_description + ' updated'
      - project_update.resource.notification_config.topic_id == devops_alt_topic.resource.topic_id
      - project_update.resource.freeform_tags.phase == 'update'

- name: Wait for project update visibility
  ansible.oci.oci_devops_project_info:
    project_id: "{{ project_create.resource.id }}"
  register: project_after_update
  until: >-
    project_after_update.projects | length == 1 and
    project_after_update.projects[0].freeform_tags.phase == 'update' and
    project_after_update.projects[0].notification_config.topic_id ==
      devops_alt_topic.resource.topic_id and
    project_after_update.projects[0].description ==
      oci_devops_project_integration_description + ' updated'
  retries: 12
  delay: 5

- name: Verify update is idempotent in normal mode
  ansible.oci.oci_devops_project:
    <<: *project_update
  register: project_update_rerun
  failed_when: project_update_rerun.changed

- name: Verify update is idempotent in check mode
  ansible.oci.oci_devops_project:
    <<: *project_update
  check_mode: true
  register: project_update_check_rerun
  failed_when: project_update_check_rerun.changed

- name: Check tags-only update by name lookup
  ansible.oci.oci_devops_project: &project_tags_update
    compartment_id: "{{ oci_integration_compartment_id }}"
    name: "{{ oci_devops_project_name }}"
    freeform_tags:
      phase: tags-only
  check_mode: true
  register: project_tags_update_check
  failed_when: not project_tags_update_check.changed

- name: Verify tags-only check left the project unchanged
  ansible.oci.oci_devops_project_info:
    project_id: "{{ project_create.resource.id }}"
  register: project_tags_update_check_info
  failed_when: >-
    project_tags_update_check_info.projects | length != 1 or
    project_tags_update_check_info.projects[0].freeform_tags.phase != 'update' or
    project_tags_update_check_info.projects[0].description !=
      oci_devops_project_integration_description + ' updated'

- name: Update project tags only by name lookup
  ansible.oci.oci_devops_project:
    <<: *project_tags_update
  register: project_tags_update

- name: Verify tags-only update preserved the other fields
  ansible.builtin.assert:
    that:
      - project_tags_update.changed
      - project_tags_update.resource.id == project_create.resource.id
      - project_tags_update.resource.freeform_tags.phase == 'tags-only'
      - project_tags_update.resource.description == oci_devops_project_integration_description + ' updated'
      - project_tags_update.resource.notification_config.topic_id == devops_alt_topic.resource.topic_id

- name: Wait for tags-only update visibility
  ansible.oci.oci_devops_project_info:
    project_id: "{{ project_create.resource.id }}"
  register: project_after_tags_update
  until: >-
    project_after_tags_update.projects | length == 1 and
    project_after_tags_update.projects[0].freeform_tags.phase == 'tags-only'
  retries: 12
  delay: 5

- name: Verify tags-only update is idempotent in normal mode
  ansible.oci.oci_devops_project:
    <<: *project_tags_update
  register: project_tags_update_rerun
  failed_when: >-
    project_tags_update_rerun.changed or
    project_tags_update_rerun.resource.id != project_create.resource.id

- name: Verify tags-only update is idempotent in check mode
  ansible.oci.oci_devops_project:
    <<: *project_tags_update
  check_mode: true
  register: project_tags_update_check_rerun
  failed_when: >-
    project_tags_update_check_rerun.changed or
    project_tags_update_check_rerun.resource.id != project_create.resource.id

- name: Verify changing the name of an existing project fails
  ansible.oci.oci_devops_project:
    project_id: "{{ project_create.resource.id }}"
    name: "{{ oci_devops_project_name }}-renamed"
  register: project_rename
  ignore_errors: true

- name: Verify the rename attempt reported an unsupported change
  ansible.builtin.assert:
    that:
      - project_rename is failed
      - "'name' in project_rename.msg"

- name: Check project deletion
  ansible.oci.oci_devops_project: &project_delete
    project_id: "{{ project_create.resource.id }}"
    state: absent
  check_mode: true
  register: project_delete_check
  failed_when: not project_delete_check.changed

- name: Verify deletion check left the project present
  ansible.oci.oci_devops_project_info:
    project_id: "{{ project_create.resource.id }}"
  register: project_delete_check_info
  failed_when: >-
    project_delete_check_info.projects | length != 1 or
    project_delete_check_info.projects[0].lifecycle_state != 'ACTIVE'

- name: Delete project
  ansible.oci.oci_devops_project:
    <<: *project_delete
  register: project_delete
  failed_when: not project_delete.changed

- name: Wait until the project is absent from the active list
  ansible.oci.oci_devops_project_info:
    compartment_id: "{{ oci_integration_compartment_id }}"
    name: "{{ oci_devops_project_name }}"
    lifecycle_state: active
  register: project_after_delete
  until: project_after_delete.projects | length == 0
  retries: 12
  delay: 5

- name: Verify project deletion is idempotent
  ansible.oci.oci_devops_project:
    <<: *project_delete
  register: project_delete_rerun
  failed_when: project_delete_rerun.changed

- name: Verify project deletion is idempotent in check mode
  ansible.oci.oci_devops_project:
    <<: *project_delete
  check_mode: true
  register: project_delete_check_rerun
  failed_when: project_delete_check_rerun.changed

- name: Clear project cleanup markers after verified delete
  ansible.builtin.set_fact:
    oci_devops_project_cleanup_id: ""
    oci_devops_project_cleanup_name: ""
