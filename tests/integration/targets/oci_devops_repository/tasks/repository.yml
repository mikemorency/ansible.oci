---
# Only hosted repositories are exercised here. Mirrored and forked
# repositories need a DevOps external connection holding third-party
# credentials, which the integration environment does not provide.
- name: Check repository creation
  ansible.oci.oci_devops_repository: &repository_create
    project_id: "{{ devops_repository_project.resource.id }}"
    name: "{{ oci_devops_repository_name }}"
    description: "{{ oci_devops_repository_integration_description }}"
    repository_type: hosted
    default_branch: "{{ oci_devops_repository_integration_default_branch }}"
    freeform_tags: "{{ oci_devops_repository_integration_create_tags }}"
  check_mode: true
  register: repository_create_check

- name: Verify creation check left the repository absent
  ansible.oci.oci_devops_repository_info:
    project_id: "{{ devops_repository_project.resource.id }}"
    name: "{{ oci_devops_repository_name }}"
  register: repository_create_check_info
  failed_when: >-
    not repository_create_check.changed or
    repository_create_check_info.repositories | length != 0

- name: Create repository
  ansible.oci.oci_devops_repository:
    <<: *repository_create
  register: repository_create

- name: Capture repository id for cleanup
  ansible.builtin.set_fact:
    oci_devops_repository_cleanup_id: "{{ repository_create.resource.id }}"

- name: Verify created repository values
  ansible.builtin.assert:
    that:
      - repository_create.changed
      - repository_create.resource.id | length > 0
      - repository_create.resource.name == oci_devops_repository_name
      - repository_create.resource.project_id == devops_repository_project.resource.id
      - repository_create.resource.compartment_id == oci_integration_compartment_id
      - repository_create.resource.description == oci_devops_repository_integration_description
      - repository_create.resource.repository_type == 'HOSTED'
      - repository_create.resource.default_branch == oci_devops_repository_integration_default_branch
      - repository_create.resource.lifecycle_state == 'ACTIVE'
      - repository_create.resource.freeform_tags.phase == 'create'

- name: Wait for repository visibility by exact name
  ansible.oci.oci_devops_repository_info:
    project_id: "{{ devops_repository_project.resource.id }}"
    name: "{{ oci_devops_repository_name }}"
    lifecycle_state: active
  register: repository_by_name
  until: repository_by_name.repositories | length == 1
  retries: 12
  delay: 5

- name: Verify repository creation is idempotent without repository_id
  ansible.oci.oci_devops_repository:
    <<: *repository_create
  register: repository_create_rerun
  failed_when: >-
    repository_create_rerun.changed or
    repository_create_rerun.resource.id != repository_create.resource.id

- name: Verify repository creation is idempotent in check mode
  ansible.oci.oci_devops_repository:
    <<: *repository_create
  check_mode: true
  register: repository_create_check_rerun
  failed_when: >-
    repository_create_check_rerun.changed or
    repository_create_check_rerun.resource.id != repository_create.resource.id

- name: Retrieve repository by id
  ansible.oci.oci_devops_repository_info:
    repository_id: "{{ repository_create.resource.id }}"
  register: repository_by_id

- name: Retrieve repositories by compartment
  ansible.oci.oci_devops_repository_info:
    compartment_id: "{{ oci_integration_compartment_id }}"
  register: repositories_in_compartment

- name: Verify info queries return the repository
  ansible.builtin.assert:
    that:
      - repository_by_id.repositories | length == 1
      - repository_by_id.repositories[0].id == repository_create.resource.id
      - repository_by_id.repositories[0].name == oci_devops_repository_name
      - repository_by_id.repositories[0].project_id == devops_repository_project.resource.id
      - repository_by_id.repositories[0].repository_type == 'HOSTED'
      - repository_by_id.repositories[0].http_url | length > 0
      - repository_by_id.repositories[0].ssh_url | length > 0
      - >-
        repositories_in_compartment.repositories
        | selectattr('id', 'equalto', repository_create.resource.id) | list | length == 1

- name: Check repository update
  ansible.oci.oci_devops_repository: &repository_update
    repository_id: "{{ repository_create.resource.id }}"
    description: "{{ oci_devops_repository_integration_description }} updated"
    default_branch: "{{ oci_devops_repository_integration_updated_branch }}"
    freeform_tags: "{{ oci_devops_repository_integration_update_tags }}"
  check_mode: true
  register: repository_update_check
  failed_when: not repository_update_check.changed

- name: Verify update check left the repository unchanged
  ansible.oci.oci_devops_repository_info:
    repository_id: "{{ repository_create.resource.id }}"
  register: repository_update_check_info
  failed_when: >-
    repository_update_check_info.repositories | length != 1 or
    repository_update_check_info.repositories[0].description !=
      oci_devops_repository_integration_description or
    repository_update_check_info.repositories[0].default_branch !=
      oci_devops_repository_integration_default_branch or
    repository_update_check_info.repositories[0].freeform_tags.phase != 'create'

- name: Update repository
  ansible.oci.oci_devops_repository:
    <<: *repository_update
  register: repository_update

- name: Verify updated repository values
  ansible.builtin.assert:
    that:
      - repository_update.changed
      - repository_update.resource.id == repository_create.resource.id
      - repository_update.resource.name == oci_devops_repository_name
      - repository_update.resource.description == oci_devops_repository_integration_description + ' updated'
      - repository_update.resource.default_branch == oci_devops_repository_integration_updated_branch
      - repository_update.resource.freeform_tags.phase == 'update'

- name: Wait for repository update visibility
  ansible.oci.oci_devops_repository_info:
    repository_id: "{{ repository_create.resource.id }}"
  register: repository_after_update
  until: >-
    repository_after_update.repositories | length == 1 and
    repository_after_update.repositories[0].freeform_tags.phase == 'update' and
    repository_after_update.repositories[0].default_branch ==
      oci_devops_repository_integration_updated_branch and
    repository_after_update.repositories[0].description ==
      oci_devops_repository_integration_description + ' updated'
  retries: 12
  delay: 5

- name: Verify update is idempotent in normal mode
  ansible.oci.oci_devops_repository:
    <<: *repository_update
  register: repository_update_rerun
  failed_when: repository_update_rerun.changed

- name: Verify update is idempotent in check mode
  ansible.oci.oci_devops_repository:
    <<: *repository_update
  check_mode: true
  register: repository_update_check_rerun
  failed_when: repository_update_check_rerun.changed

- name: Check tags-only update by name lookup
  ansible.oci.oci_devops_repository: &repository_tags_update
    project_id: "{{ devops_repository_project.resource.id }}"
    name: "{{ oci_devops_repository_name }}"
    freeform_tags:
      phase: tags-only
  check_mode: true
  register: repository_tags_update_check
  failed_when: not repository_tags_update_check.changed

- name: Verify tags-only check left the repository unchanged
  ansible.oci.oci_devops_repository_info:
    repository_id: "{{ repository_create.resource.id }}"
  register: repository_tags_update_check_info
  failed_when: >-
    repository_tags_update_check_info.repositories | length != 1 or
    repository_tags_update_check_info.repositories[0].freeform_tags.phase != 'update' or
    repository_tags_update_check_info.repositories[0].description !=
      oci_devops_repository_integration_description + ' updated'

- name: Update repository tags only by name lookup
  ansible.oci.oci_devops_repository:
    <<: *repository_tags_update
  register: repository_tags_update

- name: Verify tags-only update preserved the other fields
  ansible.builtin.assert:
    that:
      - repository_tags_update.changed
      - repository_tags_update.resource.id == repository_create.resource.id
      - repository_tags_update.resource.freeform_tags.phase == 'tags-only'
      - repository_tags_update.resource.description ==
        oci_devops_repository_integration_description + ' updated'
      - repository_tags_update.resource.default_branch == oci_devops_repository_integration_updated_branch

- name: Wait for tags-only update visibility
  ansible.oci.oci_devops_repository_info:
    repository_id: "{{ repository_create.resource.id }}"
  register: repository_after_tags_update
  until: >-
    repository_after_tags_update.repositories | length == 1 and
    repository_after_tags_update.repositories[0].freeform_tags.phase == 'tags-only'
  retries: 12
  delay: 5

- name: Verify tags-only update is idempotent in normal mode
  ansible.oci.oci_devops_repository:
    <<: *repository_tags_update
  register: repository_tags_update_rerun
  failed_when: >-
    repository_tags_update_rerun.changed or
    repository_tags_update_rerun.resource.id != repository_create.resource.id

- name: Verify tags-only update is idempotent in check mode
  ansible.oci.oci_devops_repository:
    <<: *repository_tags_update
  check_mode: true
  register: repository_tags_update_check_rerun
  failed_when: >-
    repository_tags_update_check_rerun.changed or
    repository_tags_update_check_rerun.resource.id != repository_create.resource.id

# Unlike a DevOps project, OCI allows renaming a repository, so the rename is
# driven by repository_id; a name lookup would search for the new name instead.
- name: Check repository rename
  ansible.oci.oci_devops_repository: &repository_rename
    repository_id: "{{ repository_create.resource.id }}"
    name: "{{ oci_devops_repository_renamed }}"
  check_mode: true
  register: repository_rename_check
  failed_when: not repository_rename_check.changed

- name: Verify rename check left the repository name unchanged
  ansible.oci.oci_devops_repository_info:
    repository_id: "{{ repository_create.resource.id }}"
  register: repository_rename_check_info
  failed_when: >-
    repository_rename_check_info.repositories | length != 1 or
    repository_rename_check_info.repositories[0].name != oci_devops_repository_name

- name: Rename repository
  ansible.oci.oci_devops_repository:
    <<: *repository_rename
  register: repository_rename

- name: Track the renamed repository for cleanup
  ansible.builtin.set_fact:
    oci_devops_repository_cleanup_name: "{{ oci_devops_repository_renamed }}"

- name: Verify the rename applied
  ansible.builtin.assert:
    that:
      - repository_rename.changed
      - repository_rename.resource.id == repository_create.resource.id
      - repository_rename.resource.name == oci_devops_repository_renamed

- name: Wait for the rename to be visible by the new name
  ansible.oci.oci_devops_repository_info:
    project_id: "{{ devops_repository_project.resource.id }}"
    name: "{{ oci_devops_repository_renamed }}"
  register: repository_after_rename
  until: >-
    repository_after_rename.repositories | length == 1 and
    repository_after_rename.repositories[0].id == repository_create.resource.id
  retries: 12
  delay: 5

- name: Verify rename is idempotent in normal mode
  ansible.oci.oci_devops_repository:
    <<: *repository_rename
  register: repository_rename_rerun
  failed_when: repository_rename_rerun.changed

- name: Verify rename is idempotent in check mode
  ansible.oci.oci_devops_repository:
    <<: *repository_rename
  check_mode: true
  register: repository_rename_check_rerun
  failed_when: repository_rename_check_rerun.changed

- name: Verify moving a repository to another project fails
  ansible.oci.oci_devops_repository:
    repository_id: "{{ repository_create.resource.id }}"
    project_id: "ocid1.devopsproject.oc1..nonexistent"
  register: repository_move
  ignore_errors: true

- name: Verify the move attempt reported an unsupported change
  ansible.builtin.assert:
    that:
      - repository_move is failed
      - "'project_id' in repository_move.msg"

- name: Check repository deletion
  ansible.oci.oci_devops_repository: &repository_delete
    repository_id: "{{ repository_create.resource.id }}"
    state: absent
  check_mode: true
  register: repository_delete_check
  failed_when: not repository_delete_check.changed

- name: Verify deletion check left the repository present
  ansible.oci.oci_devops_repository_info:
    repository_id: "{{ repository_create.resource.id }}"
  register: repository_delete_check_info
  failed_when: >-
    repository_delete_check_info.repositories | length != 1 or
    repository_delete_check_info.repositories[0].lifecycle_state != 'ACTIVE'

- name: Delete repository
  ansible.oci.oci_devops_repository:
    <<: *repository_delete
  register: repository_delete
  failed_when: not repository_delete.changed

- name: Wait until the repository is absent from the active list
  ansible.oci.oci_devops_repository_info:
    project_id: "{{ devops_repository_project.resource.id }}"
    name: "{{ oci_devops_repository_renamed }}"
    lifecycle_state: active
  register: repository_after_delete
  until: repository_after_delete.repositories | length == 0
  retries: 12
  delay: 5

- name: Verify repository deletion is idempotent
  ansible.oci.oci_devops_repository:
    <<: *repository_delete
  register: repository_delete_rerun
  failed_when: repository_delete_rerun.changed

- name: Verify repository deletion is idempotent in check mode
  ansible.oci.oci_devops_repository:
    <<: *repository_delete
  check_mode: true
  register: repository_delete_check_rerun
  failed_when: repository_delete_check_rerun.changed

- name: Clear repository cleanup markers after verified delete
  ansible.builtin.set_fact:
    oci_devops_repository_cleanup_id: ""
    oci_devops_repository_cleanup_name: ""
